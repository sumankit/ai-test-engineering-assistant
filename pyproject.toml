[project]
name = "ai-test-engineering-assistant"
version = "0.1.0"
description = "LangGraph-based AI test engineering assistant: requirement analysis, test case generation, and traceability from requirement documents."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # --- API ---
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.12",
    "pydantic==2.9.2",
    "python-dotenv==1.0.1",

    # --- Orchestration ---
    "langgraph==0.2.39",
    "langchain-core==0.3.15",
    "langchain-groq==0.2.1",          # LLM_PROVIDER=groq
    "langchain-google-genai==2.0.4",  # LLM_PROVIDER=gemini
    "langsmith==0.1.147",

    # --- Parsing ---
    "docling>=2.5.2",
    "pymupdf==1.24.11",               # fallback PDF parser
    "python-docx==1.1.2",             # fallback DOCX parser

    # --- Persistence ---
    "pymongo==4.9.2",                 # MongoDB Atlas
    "supabase==2.9.0",                # Supabase storage
    "sqlalchemy==2.0.35",             # Relational database ORM
    "psycopg2-binary==2.9.12",         # Postgres driver for SQLAlchemy (Supabase DATABASE_URL)

    # --- Tools ---
    "rapidfuzz==3.10.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "8.3.3"
httpx = "0.27.2"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
